[hikyuu]
tmpdir = ./test_data/tmp
datadir = ./test_data

[block]
type  = qianlong
dir = ./test_data/block
指数板块 = zsbk.ini
行业板块 = hybk.ini
地域板块 = dybk.ini
概念板块 = gnbk.ini
self = self.ini

[preload]
day = True
week = False
month = False
quarter = False
halfyear = False
year = False
min = False
min5 = False
min15 = False
min30 = False
min60 = False
hour2 = False
day_max = 100000
week_max = 100000
month_max = 100000
quarter_max = 100000
halfyear_max = 100000
year_max = 100000
min_max = 5120
min5_max = 5120
min15_max = 5120
min30_max = 5120
min60_max = 5120
hour2_max = 5120

[baseinfo]
type = sqlite3
db = ./test_data/stock.db

[kdata]
type = hdf5
sh_day  = ./test_data/sh_day.h5
sh_min  = ./test_data/sh_1min.h5
sh_min5 = ./test_data/sh_5min.h5
sz_day  = ./test_data/sz_day.h5
sz_min  = ./test_data/sz_1min.h5
sz_min5 = ./test_data/sz_5min.h5
sh_time = ./test_data/sh_time.h5
sz_time = ./test_data/sz_time.h5
sh_trans = ./test_data/sh_trans.h5
sz_trans = ./test_data/sz_trans.h5
; Multi-market representative index day bars (test_data fixture,
; generated by hikyuu/test/tools/gen_multimarket_day_fixture.py)
; {m}_day implicitly covers DAY/WEEK/MONTH/QUARTER/HALFYEAR/YEAR; unconfigured = period not supported (silently empty)
; Note: the 9 new markets only have the day data group, no derived index tables; WEEK..YEAR queries are silently empty
shf_day = ./test_data/shf_day.h5
czc_day = ./test_data/czc_day.h5
cfe_day = ./test_data/cfe_day.h5
dce_day = ./test_data/dce_day.h5
ine_day = ./test_data/ine_day.h5
gfe_day = ./test_data/gfe_day.h5
hk_day = ./test_data/hk_day.h5
nasdaq_day = ./test_data/nasdaq_day.h5
nyse_day = ./test_data/nyse_day.h5
; NASDAQ minute-bar fixture (multi-market read-side unified expression carrier,
; generated by hikyuu/test/tools/gen_nasdaq_min_fixture.py)
; {m}_min5 covers MIN5/MIN15/MIN30/MIN60/HOUR2 with one key; only data and min15 groups exist, others silently empty
nasdaq_min5 = ./test_data/nasdaq_5min.h5
