---
layout: default
---

<article>
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-date">{{ page.date | date: "%Y-%m-%d" }}</p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <a class="back-link" href="{% if page.lang == 'en' %}{{ '/blog/en/' | relative_url }}{% else %}{{ '/blog/zh/' | relative_url }}{% endif %}">{% if page.lang == 'en' %}← Back to Blog{% else %}← 返回博客目录{% endif %}</a>
</article>
