name: win-build

on: 
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022, windows-2025]
        arch: [x64] #, arm64]

    concurrency:
        group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-Windows-${{ matrix.os }}-${{ matrix.arch }}
        cancel-in-progress: true    
    
    steps:
    - uses: actions/checkout@v4

    - name: Install VS ClangCL component
      run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          & $installer modify --installPath $vsPath --add "Microsoft.VisualStudio.Component.VC.LLVM" --quiet --norestart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Load MSVC dev environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Add VS clang-cl to PATH
      run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Add-Content -Path $env:GITHUB_PATH -Value "$vsPath\VC\Tools\Llvm\x64\bin"

    - name: Verify clang-cl (must be VS bundled one)
      run: |
        where clang-cl
        clang-cl --version

    - uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: 3.0.8
        actions-cache-folder: '.xmake-cache'
        actions-cache-key: 'windows'

    - name: configure
      shell: cmd
      run: |
        pip install -r requirements.txt      
        xmake f -c -k shared --feedback=n -y -vD

    - name: build
      shell: cmd
      run: |
        xmake -b core        

    - name: small-test
      shell: cmd
      run: |
        xmake r small-test

    - name: test python
      shell: cmd
      run: |
        set PYTHONPATH=.
        python hikyuu/test/test.py        