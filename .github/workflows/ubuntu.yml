name: ubuntu-build

on: 
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        arch: [aarch64, x86_64]
    
    concurrency:
        group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-Ubuntu-${{ matrix.arch }}
        cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4


      - name: Cache packages
        id: cache-xmake-ubuntu
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.xmake
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.0.8
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: 'ubuntu'

      - name: configure
        run: |
          export PYTHONPATH=.
          pip3 install -r requirements.txt      
          xmake f --feedback=n -k shared -y

      - name: build
        run: |
          xmake -b core

      - name: test python
        run: |
          export PYTHONPATH=.
          python3 hikyuu/test/test.py
          
      - name: test
        run: |
          xmake r small-test

  docs:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip3 install nbformat
          pip3 install -r docs/requirements.txt

      - name: Build English docs
        run: |
          sphinx-build -b html docs/en docs/_build/en

      - name: Build Chinese docs
        run: |
          sphinx-build -b html docs/zh docs/_build/zh

      - name: Check docs parity
        run: |
          python3 docs/tools/check_docs_parity.py

      - name: Check notebook parity
        run: |
          python3 docs/tools/check_notebook_parity.py

      - name: Check README parity
        run: |
          python3 docs/tools/check_readme_parity.py
  